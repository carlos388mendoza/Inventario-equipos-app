<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión | Inventario Grupo Comidas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4f4f5;
        color: #111;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 24rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 .5rem;
      }
      p {
        font-size: .875rem;
        color: #52525b;
        margin: 0 0 1.5rem;
      }
      button {
        display: inline-block;
        padding: .625rem 1.25rem;
        font-size: .875rem;
        font-weight: 500;
        border: none;
        border-radius: .5rem;
        background: #E10600;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Sin conexión a internet</h1>
      <p>
        No se pudo acceder a esta página sin conexión. Revisa tu conexión a la
        red y vuelve a intentar.
      </p>
      <button onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
